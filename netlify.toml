# Netlify must use the Next.js runtime, not a static-only export: this app has
# server-rendered routes and API handlers.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SITE_URL = "https://techmaths-dc.com"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Leads, subscribers and analytics events are stored in Netlify Database.
# Migrations live in netlify/database/migrations and are applied on deploy.
